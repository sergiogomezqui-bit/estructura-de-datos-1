<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="main.js"></script>
    <title>Calculadora de Cuota de Prestamo - FrontEnd</title>
</head>
<body>
    <main>
        <h1>Calculadora de Cuota de Prestamo</h1>
        <div class="contenedor">
            <table class="datos_entrada">
                <caption>Datos del prestamo</caption>
                <tr>
                    <td>Nombre</td>
                    <td><input type="text" id="nombre" required></td>
                </tr>
                <tr>
                    <td>Prestamo ($)</td>
                    <td><input type="number" step="any" id="prestamo" required></td>
                </tr>
                <tr>
                    <td>Meses (n)</td>
                    <td><input type="number" step="1" id="n" required></td>
                </tr>
                <tr>
                    <td>Interes (i, ej. 0.15)</td>
                    <td><input type="number" step="any" id="i" required></td>
                </tr>
            </table>
            <div class="error" id="error"></div>
            <div class="botones">
                <button id="calcular">Calcular</button>
                <button id="historial">Ver historial</button>
            </div>
            <textarea id="respuesta" readonly>Salida---</textarea>
        </div>
    </main>
    <footer>
        Practica de Estructuras de Datos y Algoritmos 1 - Universidad Autonoma de Occidente
    </footer>
</body>
</html>
